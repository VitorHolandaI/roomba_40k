# Config mínima do mediamtx só pra servir a câmera CSI por WebRTC (baixa
# latência, mídia UDP). O mediamtx completa o resto com os defaults dele
# (WebRTC na porta 8889). A câmera é lida direto via libcamera pelo source
# nativo `rpiCamera` — sem rpicam-vid nem ffmpeg; encode H.264 por HW.
#
# Player pronto:  http://<ip-do-pi>:8889/cam
paths:
  cam:
    source: rpiCamera
    # Conservador p/ wifi fraco do Pi 3 (cliente em subnet diferente = hop
    # extra). Se o link aguentar, suba res/fps/bitrate. "reader is too slow"
    # = cliente atrás da câmera; some ao reduzir a produção.
    rpiCameraWidth: 320
    rpiCameraHeight: 240
    rpiCameraFPS: 12
    rpiCameraBitrate: 800000
