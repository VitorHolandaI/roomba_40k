# Config mínima do mediamtx só pra servir a câmera CSI por WebRTC (baixa
# latência, mídia UDP). O mediamtx completa o resto com os defaults dele
# (WebRTC na porta 8889). A câmera é lida direto via libcamera pelo source
# nativo `rpiCamera` — sem rpicam-vid nem ffmpeg; encode H.264 por HW.
#
# Player pronto:  http://<ip-do-pi>:8889/cam
paths:
  cam:
    source: rpiCamera
    # 640x480: teto REALISTA do teu link atual (cross-subnet). O gargalo é a
    # REDE, não a câmera — 720p/1080p só passam no AP do robô (mesma subnet)
    # ou wifi forte. Se ainda travar aqui, desce pra 320x240.
    rpiCameraWidth: 640
    rpiCameraHeight: 480
    rpiCameraFPS: 15
    rpiCameraBitrate: 1500000
    # Keyframe a cada 15 frames (~1s): recupera sozinho após perda, sem F5.
    rpiCameraIDRPeriod: 15
