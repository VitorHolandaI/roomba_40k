# Config mínima do mediamtx só pra servir a câmera CSI por WebRTC (baixa
# latência, mídia UDP). O mediamtx completa o resto com os defaults dele
# (WebRTC na porta 8889). A câmera é lida direto via libcamera pelo source
# nativo `rpiCamera` — sem rpicam-vid nem ffmpeg; encode H.264 por HW.
#
# Player pronto:  http://<ip-do-pi>:8889/cam
# Cada quadro H.264 chega em vários fragmentos RTP. Uma fila de 8 estourava em
# todo IDR; 64 absorve a rajada sem voltar ao buffer padrão de 512 unidades.
# O valor deve ser potência de 2.
writeQueueSize: 64

paths:
  cam:
    source: rpiCamera
    # SEM rpiCameraMode de propósito: forçar 1296x972 fazia o ISP ler o sensor
    # inteiro e reduzir a cada frame (pesa memória/ISP no Pi 3). Deixando o
    # libcamera escolher, ele pega o modo 640x480 (crop 2560x1920 = quase o
    # mesmo FOV) com bem menos trabalho. FOV ~igual, performance melhor.
    rpiCameraWidth: 160
    rpiCameraHeight: 120
    rpiCameraFPS: 8
    # Perfil mínimo para testar o limite do Wi-Fi instável.
    rpiCameraBitrate: 200000
    # Keyframe a cada 8 frames (~1s a 8fps): recupera sozinho após perda.
    rpiCameraIDRPeriod: 8
