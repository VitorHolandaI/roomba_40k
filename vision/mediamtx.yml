# Config mínima do mediamtx só pra servir a câmera CSI por WebRTC (baixa
# latência, mídia UDP). O mediamtx completa o resto com os defaults dele
# (WebRTC na porta 8889). A câmera é lida direto via libcamera pelo source
# nativo `rpiCamera` — sem rpicam-vid nem ffmpeg; encode H.264 por HW.
#
# Player pronto:  http://<ip-do-pi>:8889/cam
paths:
  cam:
    source: rpiCamera
    # FOV: força a leitura FULL-SENSOR do ov5647 (modo 1296x972 usa o sensor
    # inteiro, crop 2592x1944) pra enxergar o MÁXIMO que o lens dá. Sem isso o
    # libcamera pode pegar um modo cortado (zoom) e você vê pouco. A saída é
    # escalada pra 640x480 — FOV largo NÃO custa banda (banda = saída+bitrate).
    rpiCameraMode: "1296:972:10:P"
    # MÍNIMO: o wifi do Pi 3 não aguenta mais que isso sem "reader too slow".
    # FOV segue máximo (mode full-sensor não custa banda); só a saída é leve.
    rpiCameraWidth: 320
    rpiCameraHeight: 240
    rpiCameraFPS: 10
    rpiCameraBitrate: 600000
    # Keyframe a cada 10 frames (~1s a 10fps): recupera sozinho após perda.
    rpiCameraIDRPeriod: 10
